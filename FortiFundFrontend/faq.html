<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FortiFund - FAQ</title>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>


<header id="main-header" class="main-header">
    <div class="container header-content">
        <div class="site-logo">
            <a href="index.html">
                <img src="assets/image/fortifund logo.jpg" alt="FortiFund Logo" class="logo-img">
            </a>
        </div>
        <nav class="main-nav">
            <!-- Navbar items will be dynamically loaded here by script.js -->
            <ul>
                <!-- Placeholder for dynamic content -->
                <li>Loading Navigation...</li>
            </ul>
        </nav>
    </div>
</header>


<main class="main-content">
    <!-- FAQ Section - Added data-section for dynamic loading -->
    <section class="faq-section" data-section="faq_section">
        <!-- The heading itself can also be dynamic if you want to manage it -->
        <h2 class="section-heading" data-content-key="faq_heading">Frequently Asked Questions</h2>
        <div class="faq-container">
            <!-- FAQ items will be dynamically loaded here by script.js -->
            <p>Loading FAQs...</p>
        </div>
    </section>
</main>

<!-- Footer -->
<footer class="main-footer">
    <div class="container text-center">
        <p>&copy; 2024 FortiFund. All rights reserved.</p>
        <div class="footer-links">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
        </div>
    </div>
</footer>

<!-- Custom JavaScript -->
<script src="script.js"></script>
</body>
</html>
