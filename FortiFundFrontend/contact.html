<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FortiFund - Contact Us</title>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>


<header id="main-header" class="main-header">
    <div class="container header-content">
        <div class="site-logo">
            <a href="index.html">
                <img src="assets/image/fortifund logo.jpg" alt="FortiFund Logo" class="logo-img">
            </a>
        </div>
        <nav class="main-nav">
            <!-- Navbar items will be dynamically loaded here by script.js -->
            <ul>
                <!-- Placeholder for dynamic content -->
                <li>Loading Navigation...</li>
            </ul>
        </nav>
    </div>
</header>


<main class="main-content">
    <!-- Contact Section - Added data-section for dynamic loading -->
    <section class="contact-section" data-section="contact_page">
        <!-- Added data-content-key="contact_heading" -->
        <h2 class="section-heading" data-content-key="contact_heading">Contact Us</h2>
        <div class="contact-form-container">
            <!-- Added data-content-key="contact_email_text" -->
            <p class="contact-email" data-content-key="contact_email_text">Email: <a href="mailto:admin@fortifund.net">admin@fortifund.net</a></p>
            <form id="contactForm" class="contact-form">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary full-width-btn">Send Message</button>
            </form>
            <div id="contactMessage" class="form-message success-message" style="display: none;"></div>
        </div>
    </section>
</main>

<!-- Footer -->
<footer class="main-footer">
    <div class="container text-center">
        <p>&copy; 2024 FortiFund. All rights reserved.</p>
        <div class="footer-links">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
        </div>
    </div>
</footer>

<!-- Custom JavaScript -->
<script src="script.js"></script>
</body>
</html>
